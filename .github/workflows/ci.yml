name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Compact compile, contract tests, typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify required files exist (and legacy files stay removed)
        run: node scripts/check-required-files.mjs

      - name: Install Compact devtools
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Compact toolchain 0.31.1
        run: compact update 0.31.1

      - name: Compile Compact contract (toolchain 0.31.1)
        run: compact compile +0.31.1 contracts/zk-trial.compact managed/zk-trial

      - name: Assert committed ZK artifacts match source
        run: git diff --exit-code -- managed/

      - name: Run Compact contract tests
        run: npx vitest run

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
