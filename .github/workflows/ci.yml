name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  frontend-and-zk:
    name: Frontend, lint, typecheck, ZK tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify required files exist
        run: node scripts/check-required-files.mjs

      - name: Lint
        run: npm run lint --workspace apps/web

      - name: Typecheck
        run: npm run typecheck --workspace apps/web

      - name: Run ZK circuit + lib tests
        run: npm run zk:test

      - name: Build frontend
        run: npm run build --workspace apps/web

  contract:
    name: Soroban smart contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/zk_trial/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/zk_trial/Cargo.lock') }}

      - name: Run contract unit tests
        working-directory: contracts/zk_trial
        run: cargo test

      - name: Build contract to wasm (release)
        working-directory: contracts/zk_trial
        run: cargo build --target wasm32v1-none --release
